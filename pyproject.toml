[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stackbooster"
version = "0.1.0"
description = "Map the structure of a legacy website (backend, frontend, database) and plan its rebuild on a modern stack."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "click>=8.1,<9",
    "jinja2>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    # Used only to import and check the generated starter project in tests.
    "sqlalchemy>=2.0,<3",
    "fastapi>=0.110,<1",
]

[project.scripts]
stackbooster = "stackbooster.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stackbooster = ["report/templates/*.j2", "targets/templates/*/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 135
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
